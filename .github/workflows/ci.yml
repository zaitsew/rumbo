name: check

# Manual only: the laptop's ./check.sh is the gate, and automatic runs spend the Actions budget.
# iOS and macOS repos switch `runs-on` to macos-latest by hand (macOS minutes bill at 10x).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: run check.sh
        env:
          RUMBO_OWNER_KEY: ci-only-not-a-secret
        run: ./check.sh
