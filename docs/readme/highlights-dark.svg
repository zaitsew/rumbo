<svg xmlns="http://www.w3.org/2000/svg" width="880" height="305" viewBox="0 0 880 305" role="img" aria-label="Highlights. PLANNER: One sentence becomes a trip. English, Spanish or Russian in; ranked places with live fares out. FARES: Prices from licensed sources. Every price shows its source and link. The AI never writes a number. FEED: One ranked travel feed. Scored on deal, fit, taste, urgency and novelty, with reasons shown. WATCHES: Watch routes, stays, activities. An hourly collector checks each watch within its daily caps. MCP: 13 tools for your agents. Claude, Codex, ChatGPT and Grok connect over MCP or JSON. SAFE: Agents propose, you decide. No tool books, pays or deletes. One owner key guards it all.">
